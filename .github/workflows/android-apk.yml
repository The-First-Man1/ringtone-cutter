name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK for direct download
        run: cp app/build/outputs/apk/debug/app-debug.apk ringtone-cutter.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ringtone-cutter-restored-apk
          path: ringtone-cutter.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.11-restored
          name: חיתוך רינגטונים חכם V3.11 — גרסה משוחזרת
          target_commitish: ${{ github.sha }}
          files: ringtone-cutter.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
